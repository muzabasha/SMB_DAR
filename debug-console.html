<!DOCTYPE html>
<html>

<head>
    <title>Debug Console</title>
    <style>
        body {
            font-family: monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }

        .log {
            margin: 5px 0;
            padding: 5px;
            background: #2d2d2d;
            border-left: 3px solid #4f46e5;
        }

        .error {
            border-left-color: #ef4444;
            color: #ff6b6b;
        }

        .success {
            border-left-color: #10b981;
            color: #51cf66;
        }
    </style>
</head>

<body>
    <h1>🔍 Debug Console</h1>
    <div id="logs"></div>

    <script>
        const logs = document.getElementById('logs');

        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;

        console.log = function (...args) {
            originalLog(...args);
            const msg = args.join(' ');
            const div = document.createElement('div');
            div.className = 'log success';
            div.textContent = '[LOG] ' + msg;
            logs.appendChild(div);
        };

        console.error = function (...args) {
            originalError(...args);
            const msg = args.join(' ');
            const div = document.createElement('div');
            div.className = 'log error';
            div.textContent = '[ERROR] ' + msg;
            logs.appendChild(div);
        };

        // Check if content files are loaded
        window.addEventListener('load', () => {
            console.log('Page loaded');
            console.log('unit1Content:', !!window.unit1Content);
            console.log('unit2Content:', !!window.unit2Content);
            console.log('unit3Content:', !!window.unit3Content);
            console.log('unit4Content:', !!window.unit4Content);
            console.log('courseData:', !!window.courseData);
            console.log('Components:', !!window.Components);
            console.log('app:', !!window.app);

            if (window.courseData) {
                console.log('courseData.units:', window.courseData.units.length);
                console.log('courseData.projects:', window.courseData.projects.length);
            }
        });

        // Check for errors
        window.addEventListener('error', (e) => {
            console.error('Error:', e.message, e.filename, e.lineno);
        });
    </script>

    <!-- Load all scripts -->
    <script src="js/projects-content.js"></script>
    <script src="js/unit1-content.js"></script>
    <script src="js/unit2-content.js"></script>
    <script src="js/unit3-content.js"></script>
    <script src="js/unit4-content.js"></script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/quizzes.js"></script>
    <script src="js/quizzes-enhanced.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
